# Render Blueprint configuration for Single Deployment (ShopNivo)
services:
  - type: web
    name: shopnivo
    env: python
    region: singapore
    plan: free
    buildCommand: "./backend/build.sh"
    startCommand: "cd backend && gunicorn ecommerce_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
